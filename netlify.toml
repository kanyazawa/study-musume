[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  VITE_LITE_DEPLOY = "true"

[[redirects]]
  from = "/__/auth/*"
  to = "https://study-musume.firebaseapp.com/__/auth/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/__/firebase/init.json"
  to = "https://study-musume.firebaseapp.com/__/firebase/init.json"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
